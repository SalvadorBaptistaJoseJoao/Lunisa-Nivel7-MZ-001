<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lunisa Nivel 7 Absoluta MZ-001</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:20px}
#chat{border:1px solid #0f0;height:70vh;overflow-y:auto;padding:10px;margin-bottom:10px}
input{width:80%;background:#111;color:#0f0;border:1px solid #0f0;padding:10px}
button{background:#0f0;color:#000;border:none;padding:10px 20px;cursor:pointer}
.msg{margin:10px 0}.user{color:#0ff}.lunisa{color:#0f0}
</style>
</head>
<body>
<h2>🛰️ LUNISA NIVEL 7 ABSOLUTA NODE MZ-001</h2>
<p>Lichinga - Niassa | Criada por Salvador Apeiron</p>
<div id="chat"></div>
<input id="msg" placeholder="Digite..."><button onclick="send()">ENVIAR</button>
<script>
async function send(){
 let input=document.getElementById('msg');
 let text=input.value; if(!text)return;
 let chat=document.getElementById('chat');
 chat.innerHTML+=`<div class='msg user'>YOU: ${text}</div>`;
 input.value='';
 let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
 let d=await r.json();
 chat.innerHTML+=`<div class='msg lunisa'>LUNISA: ${d.reply}</div>`;
 chat.scrollTop=chat.scrollHeight;
}
</script>
</body>
</html>
